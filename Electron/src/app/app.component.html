<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <img src="assets/icons/favicon.png" alt="" aria-hidden="true">
      <div>
        <h1>{{ 'PAGES.HOME.TITLE' | translate }}</h1>
        <span>Advanced Melee AI</span>
      </div>
    </div>

    <nav class="header-actions" aria-label="AMAI">
      <label class="language-picker">
        <span class="material-icons" aria-hidden="true">language</span>
        <span class="visually-hidden">{{ 'PAGES.MENU.SELECT_LANG' | translate }}</span>
        <select [value]="currentLanguage" (change)="changeLanguage($event)" [attr.aria-label]="'PAGES.MENU.SELECT_LANG' | translate">
          <option *ngFor="let language of languages" [value]="language.code">{{ language.label | translate }}</option>
        </select>
        <span class="material-icons picker-arrow" aria-hidden="true">expand_more</span>
      </label>
      <details class="about-menu">
        <summary class="header-button">
          <span class="material-icons" aria-hidden="true">info</span>
          <span>{{ 'PAGES.MENU.ABOUT' | translate }}</span>
          <span class="material-icons about-arrow" aria-hidden="true">expand_more</span>
        </summary>
        <div class="about-dropdown">
          <div class="about-item">v{{ installerVersion }}</div>
          <button type="button" class="about-item about-link" (click)="openAbout()">
            github.com/SMUnlimited/AMAI
          </button>
        </div>
      </details>
    </nav>
  </header>

  <div class="main-content-wrapper">
    <router-outlet></router-outlet>
  </div>

  <div *ngIf="active" class="modal-backdrop">
    <section
      #dialogPanel
      class="install-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="install-status-title"
      tabindex="-1"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true">
      <div class="modal-status" [ngClass]="status">
        <span *ngIf="status === 'running'" class="material-icons status-icon spinning" aria-hidden="true">sync</span>
        <span *ngIf="status === 'success'" class="material-icons status-icon" aria-hidden="true">check_circle</span>
        <span *ngIf="status === 'error'" class="material-icons status-icon" aria-hidden="true">error</span>
        <div>
          <h2 id="install-status-title" aria-live="polite">{{ title }}</h2>
        </div>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        [attr.aria-label]="title"
        [attr.aria-valuemin]="progressTotal ? 0 : null"
        [attr.aria-valuemax]="progressTotal ? 100 : null"
        [attr.aria-valuenow]="progressTotal ? progressPercent : null"
        [class.indeterminate]="status === 'running' && !progressTotal"
        [class.complete]="status === 'success'"
        [class.failed]="status === 'error'">
        <span [style.width.%]="status === 'success' ? 100 : progressPercent"></span>
      </div>

      <div class="destination" [title]="destination">
        <span class="material-icons" aria-hidden="true">folder</span>
        <span>{{ destination }}</span>
      </div>

      <div class="log-heading">
        <span>{{ 'PAGES.APP.LOG' | translate }}</span>
        <span *ngIf="progressTotal">{{ progressCurrent }} / {{ progressTotal }}</span>
      </div>
      <div #logareawrapper class="log-area" aria-live="polite" aria-relevant="additions text">
        <div *ngFor="let message of messages" class="log-row">{{ message }}</div>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-button" [disabled]="!couldClose" (click)="closeInstall()">
          {{ 'PAGES.APP.CLOSE' | translate }}
        </button>
      </div>
    </section>
  </div>
</div>
